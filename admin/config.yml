# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: alonxia2-spec/catalinaalonsop-portfolio
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/37db884a-1f54-4dfc-bab2-fc01ce65df25/pkce
  auth_token_endpoint: /sites/37db884a-1f54-4dfc-bab2-fc01ce65df25/token
  gateway_url: https://gateway.decapbridge.com

media_folder: "img/uploads"
public_folder: "/img/uploads"

publish_mode: simple

locale: "es"

collections:
  - name: "settings"
    label: "Datos generales"
    files:
      - file: "content/settings.json"
        label: "Nombre, portada y contacto"
        name: "settings"
        fields:
          - { label: "Nombre / firma", name: "name", widget: "string" }
          - { label: "Título de portada", name: "hero_title", widget: "text" }
          - { label: "Subtítulo de portada", name: "hero_subtitle", widget: "text" }
          - { label: "Ubicación", name: "location", widget: "string" }
          - { label: "Disponibilidad", name: "availability", widget: "string" }
          - { label: "Formatos", name: "formats", widget: "string" }
          - { label: "Email de contacto", name: "email", widget: "string" }
          - { label: "Instagram", name: "instagram", widget: "string" }

  - name: "biografia"
    label: "Biografía"
    files:
      - file: "content/biografia.json"
        label: "Biografía"
        name: "biografia"
        fields:
          - { label: "Foto de perfil", name: "photo", widget: "image", required: false }
          - { label: "Texto", name: "text", widget: "text" }
          - { label: "Firma", name: "signature", widget: "string" }

  - name: "trabajo-personal"
    label: "Trabajo personal"
    files:
      - file: "content/trabajo-personal.json"
        label: "Fotos de trabajo personal"
        name: "trabajo-personal"
        fields:
          - label: "Fotos"
            name: "items"
            widget: "list"
            fields:
              - { label: "Foto", name: "image", widget: "image" }
              - { label: "Descripción corta", name: "caption", widget: "string", required: false }
              - label: "Tamaño en la cuadrícula"
                name: "size"
                widget: "select"
                options: ["normal", "grande"]
                default: "normal"

  - name: "comisiones"
    label: "Comisiones"
    files:
      - file: "content/comisiones.json"
        label: "Fotos de comisiones / editorial"
        name: "comisiones"
        fields:
          - label: "Fotos"
            name: "items"
            widget: "list"
            fields:
              - { label: "Foto", name: "image", widget: "image" }
              - { label: "Descripción corta", name: "caption", widget: "string", required: false }
              - label: "Tamaño en la cuadrícula"
                name: "size"
                widget: "select"
                options: ["normal", "grande"]
                default: "normal"

  - name: "exposiciones"
    label: "Exposiciones"
    files:
      - file: "content/exposiciones.json"
        label: "Lista de exposiciones"
        name: "exposiciones"
        fields:
          - label: "Exposiciones"
            name: "items"
            widget: "list"
            fields:
              - { label: "Imagen", name: "image", widget: "image", required: false }
              - { label: "Título de la exposición", name: "title", widget: "string" }
              - { label: "Sala / lugar", name: "place", widget: "string" }
              - { label: "Fecha", name: "dates", widget: "string" }
              - { label: "Descripción", name: "description", widget: "text", required: false }
